; Project overrides of the engine's device profiles (Engine/Config/BaseDeviceProfiles.ini).

; Render at the screen's native resolution. The engine's iPad profiles render below it for performance
; (r.MobileContentScaleFactor=1.5 on the iPad mini 6: 1700x1116, stretched to the 2266x1488 panel), which blurs the
; UI's icons and text; this game is cheap to draw. 0 = native.
[iPadMini6 DeviceProfile]
+CVars=r.MobileContentScaleFactor=0

; Android: the factor is a multiple of 1280x720 (1.0 renders about 720 pixels tall, 0.8 on low-end devices); 0 is
; native. The engine sets it on these five profiles, which every other Android profile inherits from; remove the
; engine's line and set 0.
[Android DeviceProfile]
-CVars=r.MobileContentScaleFactor=1.0
+CVars=r.MobileContentScaleFactor=0

[Android_Low DeviceProfile]
-CVars=r.MobileContentScaleFactor=0.8
+CVars=r.MobileContentScaleFactor=0

[Android_Mid DeviceProfile]
-CVars=r.MobileContentScaleFactor=1.0
+CVars=r.MobileContentScaleFactor=0

[Android_High DeviceProfile]
-CVars=r.MobileContentScaleFactor=1.0
+CVars=r.MobileContentScaleFactor=0

[Android_Epic DeviceProfile]
-CVars=r.MobileContentScaleFactor=1.0
+CVars=r.MobileContentScaleFactor=0
